name: Daily Value Bet Analysis

on:
  schedule:
    - cron: '0 9 * * *'   # Cada día a las 9:00 UTC (10:00 Madrid invierno / 11:00 verano)
  workflow_dispatch:        # También permite ejecutarlo manualmente desde GitHub

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas scipy streamlit

      - name: Ejecutar análisis y guardar resultados
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python analyzer.py

      - name: Confirmar que el análisis terminó
        run: echo "✅ Análisis completado correctamente"
